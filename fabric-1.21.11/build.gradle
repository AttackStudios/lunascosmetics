plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

loom {
	runs {
		client {
			client()
			configName = "Luna Client"
			runDir = "run/luna"
			vmArg "-XstartOnFirstThread"
			programArgs "--username", "Luna", "--quickPlayMultiplayer", "localhost:25599"
		}
		friend {
			client()
			configName = "Friend Client"
			runDir = "run/friend"
			vmArg "-XstartOnFirstThread"
			programArgs "--username", "Friend", "--quickPlayMultiplayer", "localhost:25599"
		}
		gallery {
			client()
			configName = "Gallery Client"
			runDir = "run/gallery"
			vmArg "-XstartOnFirstThread"
			programArgs "--username", "Luna", "--quickPlayMultiplayer", "localhost:25599", "--width", "1600", "--height", "900"
		}
		title {
			client()
			configName = "Title Client"
			runDir = "run/title"
			vmArg "-XstartOnFirstThread"
		}
		server {
			runDir "run-server"
		}
	}
}
